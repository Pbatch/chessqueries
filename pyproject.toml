[project]
name = "chessqueries"
version = "0.1.0"
description = "Chess board recognition: image -> per-square (FEN-like) board state via a ViT encoder + semantic square-query decoder."
authors = [{ name = "Joel Seytre" }]
license = "PolyForm-Noncommercial-1.0.0"
readme = "README.md"
requires-python = ">=3.12,<3.13"

# ---------------------------------------------------------------------------
# Core ML runtime — encoder/decoder model, data, training, eval.
# torch is pinned loosely (no custom CUDA source); the standard Linux PyPI
# wheel ships CUDA.
# ---------------------------------------------------------------------------
dependencies = [
    "torch>=2.8,<3",
    "torchvision>=0.23,<0.24",
    "timm>=1.0,<2",                  # pretrained DINOv2/DINOv3 ViT encoders
    "pytorch-lightning>=2.4,<3",     # training loops
    "safetensors>=0.8,<0.9",         # safe, tensor-only release checkpoints

    # Data + notation + IO
    "numpy>=1.26,<2",
    "pillow>=10.2,<11",
    "tqdm>=4.66,<5",
    "requests>=2.31,<3",
    "gdown>=5.2,<6",                 # Google Drive downloads (ChessReD images; CVChess folder)
    "osfclient>=0.0.5,<0.0.6",       # OSF clone for the ChessCog synthetic dataset

    # Config
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "python-dotenv>=1.0,<2",
]

[project.urls]
Paper = "https://arxiv.org/abs/2608.30762"
Repository = "https://github.com/JSeytre/chessqueries"
Dataset = "https://huggingface.co/datasets/joelseytre/slcc"
"Model weights" = "https://huggingface.co/joelseytre/chessqueries"

# Every group is opt-in (`uv sync --group modal`); a bare `uv sync` installs the
# core package only.
[dependency-groups]
# ---------------------------------------------------------------------------
# Modal training — submit runs with scripts/train_chessqueries_modal.py and log
# them to W&B (chessqueries/train/training_job.py). The Modal image pins its
# own copy of the training dependencies; this group is the local side.
# ---------------------------------------------------------------------------
modal = [
    "modal==1.6.2",
    "wandb==0.22.3",
]

dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=7.1.0,<8",
    "python-chess>=1.999,<2",        # FEN checks in the dataset label tests
    "black>=24.0,<25",
    "isort>=5.12,<6",
    "flake8>=7.0,<8",
    "pyright",
    "ruff==0.15.18",
    "ty==0.0.92",
    "pre-commit==4.5.1",
]

[tool.uv]
default-groups = []

[tool.uv.build-backend]
module-root = ""

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Syntax errors, Pyflakes, and the low-ambiguity pycodestyle families only.
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingTypeStubs = false
exclude = [".venv", "**/__pycache__", "third_party", "data"]

[tool.ty.src]
exclude = [".venv", "**/__pycache__", "third_party", "data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
