name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Lint and test (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The runner image ships several Android SDK/NDK versions. This project
      # does not use them, while the locked PyTorch CUDA wheels need the space.
      - name: Free disk space for Python dependencies
        run: |
          sudo rm -rf /usr/local/lib/android
          df -h /

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.22"
          python-version: "3.12"

      - name: Install test dependencies
        run: >-
          uv sync --locked --no-cache --group dev

      - name: Run Ruff without relying on Git metadata
        run: uv run ruff check .

      - name: Run the test suite
        run: uv run pytest
